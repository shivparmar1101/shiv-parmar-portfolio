name: Auto Blog Publisher
on:
  schedule:
    # Runs once a day at 3:00 AM IST (9:30 AM UTC) - 1 post/day keeps the
    # queue balanced with the 30 titles the Monthly Trend Titles workflow adds.
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-blog-publisher
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate and Publish Blog (auto-retry with backoff)
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          # Free-tier quota is PER MODEL (20 requests/day on gemini-3.8-flash),
          # and gemini-flash-latest shares the primary's quota - so when the
          # primary is exhausted the chain moves to a genuinely different model.
          # Each entry is tried in order; a quota 429 skips immediately (no sleep).
          # Pinned models can get retired (404) - the chain then just moves on.
          GEMINI_FALLBACK_MODELS: gemini-3.6-flash, gemini-3.5-flash, gemini-flash-lite-latest
          # 5 attempts with exponential backoff: 30s, 60s, 120s, 240s (~7.5 min total)
          MAX_ATTEMPTS: '5'
          RETRY_DELAY_MS: '30000'
        run: node scripts/retry-generate.js

      # Apply all SEO/CWV/E-E-A-T/RSS optimizations to the new post (+ existing, idempotent)
      - name: Enhance new post (internal links, FAQ schema, author box, CWV, RSS)
        run: node scripts/enhance.js

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add blog-queue.json blog/ images/blog/ blog.html index.html sitemap.xml rss.xml
            git commit -m "Auto: Publish new blog post"
            git push
            echo "Changes pushed to repository"
          else
            echo "No changes to commit"
          fi

      - name: Verify blog is live on Netlify
        run: |
          LATEST_BLOG=$(git diff --name-only HEAD~1 2>/dev/null | grep "^blog/.*\.html$" | head -1 || true)

          if [ -z "$LATEST_BLOG" ]; then
            echo "No new blog file in this commit - skipping live check"
            exit 0
          fi

          SLUG=$(basename "$LATEST_BLOG" .html)
          URL="https://shiv-parmar-portfolio.netlify.app/blog/${SLUG}.html"
          echo "Waiting for Netlify deploy: $URL"

          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo "000")
            echo "attempt ${i}/40 -> ${STATUS}"
            if [ "$STATUS" = "200" ]; then
              echo "LIVE: $URL"
              exit 0
            fi
            sleep 20
          done

          echo "::error::Blog still not live after ~13 minutes: $URL"
          echo "Possible causes: Netlify build skipped/failed, or Ignore Builds setting is active."
          exit 1

      # Google reads the sitemap on its own schedule - push it to Search Console the
      # moment the new post is live instead of waiting for the daily GSC run.
      # Best-effort: never fails the publish workflow.
      - name: Submit sitemap to Google Search Console
        if: success()
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_SITE_URL: https://shiv-parmar-portfolio.netlify.app/
        run: node scripts/gsc-indexing.js --sitemap-only

      # Best-effort crawl nudge for the URL that was just published. Google's Indexing
      # API is officially documented for JobPosting/LiveStream only, so a 403 here is
      # expected and harmless - the sitemap submit above is the real signal.
      - name: Notify Google Indexing API (new URL)
        if: success()
        continue-on-error: true
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: |
          MSG=$(git log -1 --pretty=%s)
          if [ "$MSG" != "Auto: Publish new blog post" ]; then
            echo "Last commit is not a new publish ($MSG) - skipping"
            exit 0
          fi
          LATEST=$(git diff --name-only HEAD~1 | grep "^blog/.*\.html$" | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "No new blog file in this commit - skipping"
            exit 0
          fi
          SLUG=$(basename "$LATEST" .html)
          node scripts/request-indexing.js --url="https://shiv-parmar-portfolio.netlify.app/blog/${SLUG}"

      # Email notification is handled by blog-email-notification.yml (triggered on push)
      # to avoid duplicate emails. Keep this step removed.
      - name: Send Failure Email
        if: failure()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: node scripts/send-failure-email.js
