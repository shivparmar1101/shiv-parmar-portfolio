name: Auto Blog Publisher
on:
  schedule:
    # Runs at 3:00 AM and 3:00 PM IST (9:30 AM and 9:30 PM UTC)
    - cron: '30 9 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-blog-publisher
  cancel-in-progress: false

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate and Publish Blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          echo "========================================="
          echo "Auto Blog Publisher"
          echo "Time: $(date)"
          echo "========================================="

          mkdir -p blog
          mkdir -p images/blog

          node scripts/auto-blog-generator.js

          echo "========================================="
          echo "Blog generation complete"
          echo "========================================="

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ -n "$(git status --porcelain)" ]; then
            git add blog-queue.json blog/ images/blog/ blog.html index.html sitemap.xml
            git commit -m "Auto: Publish new blog post [skip ci]"
            git push
            echo "Changes pushed to repository"
          else
            echo "No changes to commit"
          fi

      - name: Send Email Notification
        if: success()
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          LATEST_BLOG=$(git diff --name-only HEAD~1 2>/dev/null | grep "^blog/.*\.html$" | head -1 || true)

          if [ -n "$LATEST_BLOG" ] && [ -n "$EMAIL_PASSWORD" ]; then
            TITLE=$(sed -n 's/.*<title>\([^|]*\).*/\1/p' "$LATEST_BLOG" | head -1)
            SLUG=$(basename "$LATEST_BLOG" .html)

            echo "Blog: $TITLE"
            echo "URL: https://shiv-parmar-portfolio.netlify.app/blog/$SLUG"

            export BLOG_TITLE="$TITLE"
            export BLOG_SLUG="$SLUG"

            node -e '
              const nodemailer = require("nodemailer");
              const transporter = nodemailer.createTransport({
                service: "gmail",
                auth: {
                  user: "parmarshiv1101@gmail.com",
                  pass: process.env.EMAIL_PASSWORD
                }
              });

              const title = process.env.BLOG_TITLE;
              const slug = process.env.BLOG_SLUG;

              const mailOptions = {
                from: "parmarshiv1101@gmail.com",
                to: "parmarshiv1101@gmail.com",
                subject: "New Blog Published: " + title,
                html: "<div style=\"font-family:Inter,sans-serif;max-width:600px;margin:0 auto;background:#000;color:#f0f0f0;border-radius:12px;overflow:hidden;border:1px solid #333\">" +
                  "<div style=\"background:#c9a84c;padding:20px;text-align:center\"><h1 style=\"color:#000;margin:0;font-size:24px\">New Blog Published!</h1></div>" +
                  "<div style=\"padding:24px\"><h2 style=\"color:#f0f0f0;margin-top:0\">" + title + "</h2>" +
                  "<div style=\"text-align:center;margin:24px 0\"><a href=\"https://shiv-parmar-portfolio.netlify.app/blog/" + slug + "\" style=\"display:inline-block;background:#c9a84c;color:#000;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600\">Read Blog</a></div>" +
                  "<p style=\"color:#666;font-size:12px;text-align:center\">Auto-published by GitHub Actions</p></div></div>"
              };

              transporter.sendMail(mailOptions, (error, info) => {
                if (error) { console.error("Email error:", error); process.exit(0); }
                console.log("Email sent:", info.messageId);
              });
            '
          else
            echo "Skipping email (no new blog or EMAIL_PASSWORD not set)"
          fi
