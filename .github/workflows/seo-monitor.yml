# SEO Monitor - With Report Upload
name: SEO Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run SEO Check
        run: |
          mkdir -p reports
          echo "# SEO Monitor Report" > reports/SEO-REPORT.md
          echo "**Date:** $(date)" >> reports/SEO-REPORT.md
          echo "" >> reports/SEO-REPORT.md
          echo "## Files Checked:" >> reports/SEO-REPORT.md
          find . -name "*.html" -not -path "./node_modules/*" -exec echo "- {}" \; >> reports/SEO-REPORT.md
          echo "" >> reports/SEO-REPORT.md
          echo "## Status: ✅ Completed" >> reports/SEO-REPORT.md
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-monitor-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
