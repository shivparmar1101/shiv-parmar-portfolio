# SEO Monitor - Minimal Version
name: SEO Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run SEO Check
        run: |
          echo "=== SEO Check Started ==="
          echo "Date: $(date)"
          node --version
          echo "Checking HTML files..."
          find . -name "*.html" -not -path "./node_modules/*" | head -10
          echo "=== SEO Check Complete ==="
