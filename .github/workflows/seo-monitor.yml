# SEO Keyword Monitor - Simple & Reliable
name: SEO Keyword Monitor

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install and Run
        run: |
          npm install cheerio
          node -e "
            const fs = require('fs');
            const path = require('path');
            const cheerio = require('cheerio');
            
            const files = fs.readdirSync('.').filter(f => f.endsWith('.html'));
            let issues = 0;
            let passed = 0;
            
            files.forEach(file => {
              const html = fs.readFileSync(file, 'utf8');
              const $ = cheerio.load(html);
              const title = $('title').text().trim();
              const desc = $('meta[name=\"description\"]').attr('content') || '';
              
              if (!title) { console.log('Missing title: ' + file); issues++; }
              else { passed++; }
              
              if (!desc) { console.log('Missing description: ' + file); issues++; }
              else { passed++; }
            });
            
            console.log('Passed: ' + passed + ', Issues: ' + issues);
          "
      
      - name: Create Report
        run: |
          mkdir -p reports
          echo '{"date":"'$(date +%Y-%m-%d)'","status":"completed"}' > reports/seo-report.json
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: reports/
          retention-days: 7
