# Auto SEO Fixer - With Report Upload
name: Auto SEO Fix

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install Dependencies
        run: npm install cheerio
      
      - name: Auto Fix SEO Issues
        run: node scripts/auto-fix-seo.js
      
      - name: Create Summary Report
        run: |
          mkdir -p reports
          echo "# SEO Auto-Fix Report" > reports/REPORT.md
          echo "**Date:** $(date)" >> reports/REPORT.md
          echo "" >> reports/REPORT.md
          echo "## Changes Made:" >> reports/REPORT.md
          echo "Auto-fix completed. Check git commit for details." >> reports/REPORT.md
          echo "" >> reports/REPORT.md
          echo "## Next Steps:" >> reports/REPORT.md
          echo "- Review git commit changes" >> reports/REPORT.md
          echo "- Check website for updates" >> reports/REPORT.md
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: seo-fix-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
