# Content Check - Minimal Version
name: Content Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  content-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run Content Check
        run: |
          echo "=== Content Check Started ==="
          echo "Date: $(date)"
          node --version
          echo "Checking blog posts..."
          ls -la blog/ 2>/dev/null || echo "No blog directory"
          echo "=== Content Check Complete ==="
