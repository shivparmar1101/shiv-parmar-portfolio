# Content SEO Check - Simple & Reliable
name: Content SEO Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  content-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install and Run
        run: |
          npm install cheerio
          node -e "
            const fs = require('fs');
            const cheerio = require('cheerio');
            
            const files = [];
            if (fs.existsSync('blog')) {
              fs.readdirSync('blog').filter(f => f.endsWith('.html')).forEach(f => files.push('blog/' + f));
            }
            
            let issues = 0;
            let passed = 0;
            
            console.log('=== Content SEO Check ===');
            console.log('Checking ' + files.length + ' blog posts...');
            
            files.forEach(file => {
              const html = fs.readFileSync(file, 'utf8');
              const $ = cheerio.load(html);
              const title = $('title').text().trim();
              const desc = $('meta[name=\"description\"]').attr('content') || '';
              
              if (title.includes('Shiv Parmar')) { passed++; }
              else { console.log('Missing brand: ' + file); issues++; }
              
              if (desc.length > 100) { passed++; }
              else { console.log('Short description: ' + file); issues++; }
            });
            
            console.log('Passed: ' + passed + ', Issues: ' + issues);
          "
      
      - name: Create Report
        run: |
          mkdir -p reports
          echo '{"date":"'$(date +%Y-%m-%d)'","status":"completed"}' > reports/content-report.json
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: content-report
          path: reports/
          retention-days: 7
