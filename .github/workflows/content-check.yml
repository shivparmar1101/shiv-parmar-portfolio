# Content Monitor - Check for SEO Issues
# Runs on every push to main

name: Content SEO Check

on:
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - 'blog/**'
  
  pull_request:
    branches: [ main ]
  
  workflow_dispatch:

jobs:
  content-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install cheerio --save
      
      - name: Check All HTML Files
        run: node scripts/check-html-seo.js
      
      - name: Check Blog Post SEO
        run: node scripts/check-blog-seo.js
      
      - name: Generate Validation Report
        run: node scripts/generate-report.js
      
      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
