# Keyword Tracker - Weekly Deep Check
# Runs every Monday automatically

name: Weekly Keyword Tracker

on:
  # Every Monday 7 AM UTC (12:30 PM IST)
  schedule:
    - cron: '0 7 * * 1'
  
  workflow_dispatch:
    inputs:
      check-type:
        description: 'Check type'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - trending

jobs:
  keyword-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm init -y
          npm install cheerio axios
      
      - name: Track Keyword Rankings
        run: node scripts/track-keywords.js
      
      - name: Check Competitor Rankings
        run: node scripts/check-competitors.js
      
      - name: Analyze Trending Topics
        run: node scripts/analyze-trends.js
      
      - name: Generate Keyword Report
        run: node scripts/keyword-report.js
      
      - name: Upload Keyword Report
        uses: actions/upload-artifact@v4
        with:
          name: keyword-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
      
      - name: Commit Keyword Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seo-data/ reports/
          git diff --staged --quiet || git commit -m "SEO: Weekly keyword tracking update [skip ci]"
          git push
