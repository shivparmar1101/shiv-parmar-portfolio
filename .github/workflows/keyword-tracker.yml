# Keyword Tracker - Minimal Version
name: Keyword Tracker

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  keyword-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Run Keyword Check
        run: |
          echo "=== Keyword Tracking Started ==="
          echo "Date: $(date)"
          node --version
          echo "Tracking keywords..."
          echo "1. hire wordpress developer"
          echo "2. wordpress developer for hire"
          echo "3. hire woocommerce developer"
          echo "=== Tracking Complete ==="
