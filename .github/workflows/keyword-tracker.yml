# Keyword Tracker - Weekly Deep Check
# Runs every Monday automatically

name: Weekly Keyword Tracker

on:
  # Every Monday 7 AM UTC (12:30 PM IST)
  schedule:
    - cron: '0 7 * * 1'
  
  workflow_dispatch:
    inputs:
      check-type:
        description: 'Check type'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - trending

jobs:
  keyword-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install cheerio axios --save
      
      - name: Track Keyword Rankings
        run: node scripts/track-keywords.js
      
      - name: Check Competitor Rankings
        run: node scripts/check-competitors.js
      
      - name: Generate Keyword Report
        run: node scripts/generate-report.js
      
      - name: Upload Keyword Report
        uses: actions/upload-artifact@v4
        with:
          name: keyword-report-${{ github.run_number }}
          path: reports/
          retention-days: 30
