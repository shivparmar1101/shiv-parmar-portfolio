# Weekly Keyword Tracker - Simple & Reliable
name: Weekly Keyword Tracker

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  keyword-tracking:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install and Run
        run: |
          npm install cheerio
          node -e "
            const fs = require('fs');
            
            const keywords = [
              'hire wordpress developer',
              'wordpress developer for hire',
              'hire woocommerce developer',
              'freelance wordpress developer',
              'hire web developer'
            ];
            
            console.log('=== Keyword Tracking ===');
            console.log('Date: ' + new Date().toISOString());
            console.log('Keywords to track: ' + keywords.length);
            keywords.forEach((kw, i) => {
              console.log((i+1) + '. ' + kw);
            });
            console.log('Tracking completed!');
          "
      
      - name: Create Report
        run: |
          mkdir -p reports
          echo '{"date":"'$(date +%Y-%m-%d)'","status":"completed"}' > reports/keyword-report.json
      
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: keyword-report
          path: reports/
          retention-days: 7
