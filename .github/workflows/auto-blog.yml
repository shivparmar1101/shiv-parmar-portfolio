name: Auto Blog Publisher

on:
  schedule:
    - cron: '0 10,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate and Publish Blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ONE }}
        run: |
          echo "========================================="
          echo "  Blog Auto-Publisher (Gemini API)"
          echo "  $(date)"
          echo "========================================="

          # Check API key
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY_ONE secret not set!"
            exit 1
          fi
          echo "API key found: ${GEMINI_API_KEY:0:10}..."

          # Get list of existing blog slugs
          EXISTING=$(ls blog/*.html 2>/dev/null | xargs -I{} basename {} .html || true)
          echo "Existing blogs: $(echo "$EXISTING" | wc -l) files"

          # All topics
          TOPICS='
wordpress-gutenberg-vs-elementor-which-is-better-in-2026|WordPress Gutenberg vs Elementor: Which is Better in 2026?|WordPress|6 min
how-to-speed-up-woocommerce-product-pages|How to Speed Up WooCommerce Product Pages|WooCommerce|5 min
building-a-wordpress-rest-api-from-scratch|Building a WordPress REST API from Scratch|WordPress|7 min
wordpress-database-optimization-guide|WordPress Database Optimization Guide|WordPress|5 min
wordpress-cron-jobs-complete-guide|WordPress Cron Jobs: Complete Guide|WordPress|4 min
wordpress-multisite-configuration-tips|WordPress Multisite Configuration Tips|WordPress|6 min
how-to-build-a-wordpress-membership-site|How to Build a WordPress Membership Site|WordPress|7 min
woocommerce-payment-gateway-comparison-2026|WooCommerce Payment Gateway Comparison 2026|WooCommerce|5 min
wordpress-security-headers-configuration|WordPress Security Headers Configuration|Security|4 min
how-to-debug-wordpress-like-a-pro|How to Debug WordPress Like a Pro|WordPress|5 min
wordpress-seo-technical-checklist|WordPress SEO Technical Checklist|SEO|6 min
woocommerce-product-variation-best-practices|WooCommerce Product Variation Best Practices|WooCommerce|5 min
wordpress-block-theme-development-guide|WordPress Block Theme Development Guide|WordPress|8 min
how-to-add-custom-css-to-wordpress-without-plugin|How to Add Custom CSS to WordPress without Plugin|WordPress|4 min
woocommerce-shipping-zones-setup-guide|WooCommerce Shipping Zones Setup Guide|WooCommerce|5 min
wordpress-post-types-and-taxonomies-explained|WordPress Post Types and Taxonomies Explained|WordPress|6 min
woocommerce-coupon-system-complete-guide|WooCommerce Coupon System Complete Guide|WooCommerce|5 min
wordpress-image-optimization-for-speed|WordPress Image Optimization for Speed|Performance|5 min
how-to-set-up-wordpress-staging-environment|How to Set Up WordPress Staging Environment|WordPress|4 min
woocommerce-inventory-management-best-practices|WooCommerce Inventory Management Best Practices|WooCommerce|5 min
wordpress-migration-guide-local-to-production|WordPress Migration Guide: Local to Production|WordPress|6 min
how-to-add-schema-markup-to-wordpress|How to Add Schema Markup to WordPress|SEO|5 min
wordpress-caching-plugins-compared-2026|WordPress Caching Plugins Compared 2026|Performance|6 min
woocommerce-product-filter-setup-guide|WooCommerce Product Filter Setup Guide|WooCommerce|5 min
wordpress-user-role-management-guide|WordPress User Role Management Guide|WordPress|5 min
how-to-create-a-wordpress-booking-system|How to Create a WordPress Booking System|WordPress|6 min
woocommerce-tax-configuration-guide|WooCommerce Tax Configuration Guide|WooCommerce|4 min
wordpress-gutenberg-block-development|WordPress Gutenberg Block Development|WordPress|7 min
woocommerce-cart-abandonment-recovery|WooCommerce Cart Abandonment Recovery|WooCommerce|5 min
wordpress-rest-api-authentication-methods|WordPress REST API Authentication Methods|WordPress|6 min
how-to-create-wordpress-mega-menu|How to Create WordPress Mega Menu|WordPress|5 min
woocommerce-product-bundles-setup|WooCommerce Product Bundles Setup|WooCommerce|5 min
wordpress-database-backup-strategies|WordPress Database Backup Strategies|WordPress|4 min'

          # Find unpublished topics
          AVAILABLE=""
          while IFS='|' read -r slug title category readtime; do
            slug=$(echo "$slug" | tr -d '[:space:]')
            [ -z "$slug" ] && continue
            if ! echo "$EXISTING" | grep -q "^${slug}$"; then
              AVAILABLE="${AVAILABLE}${slug}|${title}|${category}|${readtime}\n"
            fi
          done <<< "$TOPICS"

          AVAILABLE_COUNT=$(echo -e "$AVAILABLE" | grep -c '|' || true)
          echo "Available unpublished topics: $AVAILABLE_COUNT"

          if [ "$AVAILABLE_COUNT" -eq 0 ]; then
            echo "All topics already published! Nothing to do."
            exit 0
          fi

          # Pick first available topic
          TOPIC_LINE=$(echo -e "$AVAILABLE" | head -1)
          SLUG=$(echo "$TOPIC_LINE" | cut -d'|' -f1)
          TITLE=$(echo "$TOPIC_LINE" | cut -d'|' -f2)
          CATEGORY=$(echo "$TOPIC_LINE" | cut -d'|' -f3)
          READTIME=$(echo "$TOPIC_LINE" | cut -d'|' -f4)
          DATE=$(date +"%b %d, %Y")

          echo "Selected topic: $TITLE"
          echo "Slug: $SLUG"
          echo "Category: $CATEGORY"

          # Call Gemini API
          echo "Generating blog content with Gemini API..."
          PROMPT="Write a professional WordPress development blog post about: ${TITLE}

Requirements:
- Write in first person as Shiv Parmar, a WordPress Developer from Rajkot, India
- Include practical code examples where relevant (PHP, CSS, JavaScript)
- Use HTML formatting with h2, h3, p, code, pre, ul, ol, blockquote tags
- Make it informative and actionable
- Include a blockquote with a key insight
- Length: 800-1200 words
- Tone: Professional but friendly

Return ONLY the blog content HTML. No markdown code blocks, no backticks, just raw HTML."

          # Escape prompt for JSON
          ESCAPED_PROMPT=$(echo "$PROMPT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":${ESCAPED_PROMPT}}]}],\"generationConfig\":{\"temperature\":0.7,\"maxOutputTokens\":4096}}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "API Response HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Gemini API returned HTTP $HTTP_CODE"
            echo "$BODY" | head -5
            exit 1
          fi

          # Extract content from response
          CONTENT=$(echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          try:
              print(data['candidates'][0]['content']['parts'][0]['text'])
          except (KeyError, IndexError):
              print('')
          ")

          if [ -z "$CONTENT" ]; then
            echo "ERROR: Failed to extract content from Gemini response"
            echo "$BODY" | head -10
            exit 1
          fi

          echo "Content generated! (${#CONTENT} chars)"

          # Image URLs by category
          case "$CATEGORY" in
            WooCommerce) IMAGE="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1200&h=600&fit=crop" ;;
            SEO) IMAGE="https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=1200&h=600&fit=crop" ;;
            Security) IMAGE="https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=1200&h=600&fit=crop" ;;
            Performance) IMAGE="https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200&h=600&fit=crop" ;;
            *) IMAGE="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=1200&h=600&fit=crop" ;;
          esac

          # Generate full HTML blog post using node
          node -e "
          const fs = require('fs');
          const title = process.argv[1];
          const slug = process.argv[2];
          const date = process.argv[3];
          const readtime = process.argv[4];
          const image = process.argv[5];
          const content = process.argv[6];

          const html = \`<!DOCTYPE html>
<html lang=\"en\" data-theme=\"dark\">
<head>
<meta charset=\"UTF-8\">
<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">
<title>\${title} — Shiv Parmar</title>
<meta name=\"description\" content=\"\${title} - WordPress development guide by Shiv Parmar.\">
<link rel=\"icon\" type=\"image/svg+xml\" href=\"../favicon.svg\">
<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">
<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>
<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">
<link rel=\"stylesheet\" href=\"../style.css\">
<style>
.blog-header{padding:20px 0;border-bottom:1px solid var(--border-glass)}
.blog-header .nav{display:flex;align-items:center;justify-content:space-between}
.blog-header .logo{font-family:var(--font-primary);font-weight:800;font-size:19px;color:var(--text-primary);text-decoration:none}.blog-header .logo span{color:var(--accent)}
.blog-header .back{font-size:14px;font-weight:500;color:var(--text-muted)}
.blog-header .back:hover{color:var(--accent);text-decoration:none}
article{padding:0}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:16px;font-family:var(--font-mono)}
.breadcrumb a{color:var(--accent);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb span{margin:0 6px;opacity:0.5}
.date{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-bottom:12px}
.date .updated{color:var(--accent);margin-left:12px}
h1{font-family:var(--font-primary);font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.2;margin-bottom:24px;color:var(--text-primary)}
.toc{background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-lg);padding:24px;margin:0 0 32px}
.toc h3{font-size:16px;font-weight:700;margin:0 0 12px;color:var(--text-primary)}
.toc ul{list-style:none;padding:0;margin:0}
.toc li{margin-bottom:8px}
.toc a{font-size:14px;color:var(--text-secondary);text-decoration:none;font-family:var(--font-primary)}
.toc a:hover{color:var(--accent)}
.content{font-size:16px;color:var(--text-primary);font-family:var(--font-primary)}
.content h2{font-size:22px;font-weight:700;margin:40px 0 16px;color:var(--text-primary)}
.content h3{font-size:18px;font-weight:600;margin:32px 0 12px;color:var(--text-primary)}
.content p{margin-bottom:16px;color:var(--text-secondary)}
.content ul,.content ol{margin:0 0 16px 24px;color:var(--text-secondary)}
.content li{margin-bottom:8px}
.content code{font-family:var(--font-mono);background:var(--bg-glass-strong);padding:2px 8px;border-radius:6px;font-size:14px}
.content pre{background:#0d0d0d;color:#c7d2fe;padding:20px;border-radius:var(--radius-lg);overflow-x:auto;margin:0 0 24px;font-size:14px;line-height:1.6;border:1px solid var(--border-glass)}
.content pre code{background:none;padding:0;color:inherit}
.content blockquote{border-left:4px solid var(--accent);padding:10px 0 10px 15px;margin:20px 0;font-style:italic;color:var(--text-primary);background:var(--accent-glow-soft);border-radius:0px 15px 15px 0}
.content blockquote em{color:var(--text-primary)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px;padding:24px 0;border-top:1px solid var(--border-glass)}
.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-glow-soft);color:var(--accent)}
.author-box{display:flex;gap:20px;align-items:flex-start;padding:24px;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:var(--radius-lg);margin-top:32px}
.author-box img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.author-box .author-info h4{font-size:16px;font-weight:700;margin:0 0 4px;color:var(--text-primary)}
.author-box .author-info p{font-size:14px;color:var(--text-secondary);margin:0 0 8px}
.author-box .author-social{display:flex;gap:12px}
.author-box .author-social a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.author-box .author-social a:hover{text-decoration:underline}
.hero-img{width:100%;height:420px;object-fit:cover;border-radius:var(--radius-lg);margin-top:70px;margin-bottom:32px;border:1px solid var(--border-glass)}
@media(max-width:640px){article{padding:0}h1{font-size:24px}.hero-img{height:200px}.author-box{flex-direction:column;align-items:center;text-align:center}}
</style>
</head>
<body>
<div id=\"site-header\"></div>
<article><div class=\"container\">
<nav class=\"breadcrumb\" aria-label=\"Breadcrumb\">
<a href=\"../index.html\">Home</a><span>/</span><a href=\"../blog.html\">Blog</a><span>/</span>\${title}
</nav>
<img src=\"\${image}\" alt=\"\${title}\" title=\"\${title}\" class=\"hero-img\">
<div class=\"date\">\${date} · \${readtime} read<span class=\"updated\">Updated: \${date}</span></div>
<h1>\${title}</h1>
<div class=\"toc\" id=\"toc\">
<h3>Table of Contents</h3>
<ul id=\"tocList\"></ul>
</div>
<div class=\"content\">
\${content}
</div>
<div class=\"tags\"><span class=\"tag\">WordPress</span><span class=\"tag\">Development</span></div>
<div class=\"author-box\">
<img src=\"https://avatars.githubusercontent.com/u/shivparmar1101\" alt=\"Shiv Parmar\" onerror=\"this.src='https://ui-avatars.com/api/?name=Shiv+Parmar&background=c9a84c&color=fff&size=80'\">
<div class=\"author-info\">
<h4>Shiv Parmar</h4>
<p>WordPress Developer from Rajkot, India. Specializing in custom themes, WooCommerce, and high-performance WordPress sites.</p>
<div class=\"author-social\">
<a href=\"https://linkedin.com/in/shiv-parmar\" target=\"_blank\" rel=\"noopener\">LinkedIn</a>
<a href=\"https://github.com/shivparmar1101\" target=\"_blank\" rel=\"noopener\">GitHub</a>
</div>
</div>
</div>
</div></article>
<div id=\"site-footer\"></div>
<script src=\"../includes.js\"></script><script src=\"../script.js\"></script>
<script>
(function(){
var toc=document.getElementById(\"tocList\");
if(toc){document.querySelectorAll(\".content h2\").forEach(function(h,i){var id=\"section-\"+i;h.id=id;var li=document.createElement(\"li\");var a=document.createElement(\"a\");a.href=\"#\"+id;a.textContent=h.textContent;li.appendChild(a);toc.appendChild(li);});}
})();
</script>
</body>
</html>\`;

          fs.writeFileSync('blog/' + slug + '.html', html);
          console.log('Blog file saved: blog/' + slug + '.html');
          " "$TITLE" "$SLUG" "$DATE" "$READTIME" "$IMAGE" "$CONTENT"

          echo "Blog file created successfully!"

          # Update blog.html listing
          python3 << PYEOF
          import re

          new_card = '''
          <article class="blog-card reveal">
            <div class="date">${DATE} · ${READTIME} read</div>
            <h3><a href="blog/${SLUG}.html">${TITLE}</a></h3>
            <p>${CATEGORY} development guide covering best practices, code examples and real-world use cases.</p>
            <a class="read-more" href="blog/${SLUG}.html">Read more \&rarr;</a>
          </article>'''

          with open('blog.html', 'r', encoding='utf-8') as f:
              content = f.read()

          start_marker = '<!-- BLOG_CARDS_START -->'
          end_marker = '<!-- BLOG_CARDS_END -->'
          start_idx = content.find(start_marker)
          end_idx = content.find(end_marker)

          if start_idx > 0 and end_idx > start_idx:
              new_content = content[:start_idx + len(start_marker)] + new_card + content[end_idx:]
              with open('blog.html', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('blog.html updated!')
          else:
              print('ERROR: Markers not found in blog.html')
          PYEOF

          # Update index.html homepage blog section
          python3 << PYEOF
          import re

          new_card = '''
          <article class="blog-card reveal">
            <div class="date">${DATE} · ${READTIME} read</div>
            <h3><a href="blog/${SLUG}.html">${TITLE}</a></h3>
            <p>${CATEGORY} development guide covering best practices, code examples and real-world use cases.</p>
            <a class="read-more" href="blog/${SLUG}.html">Read more \&rarr;</a>
          </article>'''

          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          start_marker = '<!-- BLOG_CARDS_START -->'
          end_marker = '<!-- BLOG_CARDS_END -->'
          start_idx = content.find(start_marker)
          end_idx = content.find(end_marker)

          if start_idx > 0 and end_idx > start_idx:
              between = content[start_idx + len(start_marker):end_idx]
              cards = re.findall(r'<article class="blog-card reveal">.*?</article>', between, re.DOTALL)
              keep = cards[:2] if len(cards) >= 2 else cards
              new_content = content[:start_idx + len(start_marker)] + "\\n" + new_card + "\\n" + "\\n".join(keep) + "\\n" + content[end_idx:]
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('index.html updated!')
          else:
              print('ERROR: Markers not found in index.html')
          PYEOF

          echo "Homepage updated!"

          # Git commit and push
          echo "Committing to GitHub..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "blog: auto-published ${TITLE}"
          git push

          echo ""
          echo "========================================="
          echo "  Blog published successfully!"
          echo "  Title: ${TITLE}"
          echo "  File: blog/${SLUG}.html"
          echo "========================================="
