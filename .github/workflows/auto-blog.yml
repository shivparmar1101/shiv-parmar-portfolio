name: Auto Blog Publisher

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Blog Publisher
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ONE }}
        run: |
          $ErrorActionPreference = 'Stop'

          $apiKey = $env:GEMINI_API_KEY
          if (-not $apiKey) {
            Write-Host "ERROR: GEMINI_API_KEY secret not set!"
            Write-Host "Go to GitHub repo > Settings > Secrets and variables > Actions > New repository secret"
            Write-Host "Name: GEMINI_API_KEY, Value: your_gemini_api_key"
            exit 1
          }

          $topics = @(
            @{title="WordPress Gutenberg vs Elementor: Which is Better in 2026?"; cat="WordPress"; read="6 min"},
            @{title="How to Speed Up WooCommerce Product Pages"; cat="WooCommerce"; read="5 min"},
            @{title="Building a WordPress REST API from Scratch"; cat="WordPress"; read="7 min"},
            @{title="WordPress Database Optimization Guide"; cat="WordPress"; read="5 min"},
            @{title="How to Create Custom WooCommerce Product Types"; cat="WooCommerce"; read="6 min"},
            @{title="WordPress Cron Jobs: Complete Guide"; cat="WordPress"; read="4 min"},
            @{title="WooCommerce Subscription Setup Guide"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Multisite Configuration Tips"; cat="WordPress"; read="6 min"},
            @{title="How to Build a WordPress Membership Site"; cat="WordPress"; read="7 min"},
            @{title="WooCommerce Payment Gateway Comparison 2026"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Security Headers Configuration"; cat="Security"; read="4 min"},
            @{title="How to Debug WordPress Like a Pro"; cat="WordPress"; read="5 min"},
            @{title="WordPress SEO Technical Checklist"; cat="SEO"; read="6 min"},
            @{title="WooCommerce Product Variation Best Practices"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Block Theme Development Guide"; cat="WordPress"; read="8 min"},
            @{title="How to Add Custom CSS to WordPress without Plugin"; cat="WordPress"; read="4 min"},
            @{title="WooCommerce Shipping Zones Setup Guide"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Post Types and Taxonomies Explained"; cat="WordPress"; read="6 min"},
            @{title="How to Create WordPress Widget Areas"; cat="WordPress"; read="4 min"},
            @{title="WooCommerce Coupon System Complete Guide"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Image Optimization for Speed"; cat="Performance"; read="5 min"},
            @{title="How to Set Up WordPress Staging Environment"; cat="WordPress"; read="4 min"},
            @{title="WooCommerce Inventory Management Best Practices"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Migration Guide: Local to Production"; cat="WordPress"; read="6 min"},
            @{title="How to Add Schema Markup to WordPress"; cat="SEO"; read="5 min"},
            @{title="WooCommerce Email Template Customization"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Caching Plugins Compared 2026"; cat="Performance"; read="6 min"},
            @{title="How to Build a WordPress Job Board"; cat="WordPress"; read="7 min"},
            @{title="WooCommerce Product Filter Setup Guide"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress User Role Management Guide"; cat="WordPress"; read="5 min"},
            @{title="How to Create a WordPress Booking System"; cat="WordPress"; read="6 min"},
            @{title="WooCommerce Tax Configuration Guide"; cat="WooCommerce"; read="4 min"},
            @{title="WordPress Gutenberg Block Development"; cat="WordPress"; read="7 min"},
            @{title="How to Secure WordPress Login Page"; cat="Security"; read="4 min"},
            @{title="WooCommerce Cart Abandonment Recovery"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress REST API Authentication Methods"; cat="WordPress"; read="6 min"},
            @{title="How to Create WordPress Mega Menu"; cat="WordPress"; read="5 min"},
            @{title="WooCommerce Product Bundles Setup"; cat="WooCommerce"; read="5 min"},
            @{title="WordPress Database Backup Strategies"; cat="WordPress"; read="4 min"},
            @{title="How to Optimize WordPress for Core Web Vitals"; cat="Performance"; read="6 min"}
          )

          $blogDir = "blog"
          if (-not (Test-Path $blogDir)) {
            New-Item -ItemType Directory -Path $blogDir -Force | Out-Null
          }
          $existingFiles = Get-ChildItem -Path $blogDir -Filter "*.html" -File | ForEach-Object { $_.BaseName }
          $availableTopics = $topics | Where-Object {
            $slug = $_.title.ToLower() -replace '[^a-z0-9]+', '-' -replace '^-|-$', ''
            $existingFiles -notcontains $slug
          }

          if ($availableTopics.Count -eq 0) {
            Write-Host "All topics already published!"
            exit 0
          }

          $topic = $availableTopics | Get-Random
          Write-Host "Topic: $($topic.title)"
          Write-Host "Category: $($topic.cat)"

          $prompt = "Write a professional WordPress development blog post about: $($topic.title). Requirements: Write in first person as Shiv Parmar, a WordPress Developer from Rajkot, India. Include practical code examples where relevant (PHP, CSS, JavaScript). Use HTML formatting with h2, h3, p, code, pre, ul, ol, blockquote tags. Make it informative and actionable. Include a blockquote with a key insight. Length: 800-1200 words. Tone: Professional but friendly. Return ONLY the blog content HTML. No backticks or markdown tags, just raw HTML."

          $body = @{
            contents = @(
              @{
                parts = @(
                  @{text = $prompt}
                )
              }
            )
            generationConfig = @{
              temperature = 0.7
              maxOutputTokens = 16384
            }
          } | ConvertTo-Json -Depth 10

          try {
            Write-Host "Calling Gemini API..."
            $response = Invoke-RestMethod -Uri "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=$apiKey" -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 180
            $content = $response.candidates[0].content.parts[0].text
          } catch {
            Write-Host "Error calling Gemini API: $($_.Exception.Message)"
            if ($_.Exception.Response) {
              $reader = New-Object System.IO.StreamReader($_.Exception.Response.GetResponseStream())
              Write-Host "API Response: $($reader.ReadToEnd())"
            }
            exit 1
          }

          if (-not $content) {
            Write-Host "Failed to generate content! Empty response from API."
            exit 1
          }

          Write-Host "Content generated! ($($content.Length) chars)"

          $topicImages = @{
            "speed" = "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200&h=600&fit=crop"
            "performance" = "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200&h=600&fit=crop"
            "woo" = "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1200&h=600&fit=crop"
            "ecommerce" = "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=1200&h=600&fit=crop"
            "plugin" = "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1200&h=600&fit=crop"
            "code" = "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1200&h=600&fit=crop"
            "develop" = "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1200&h=600&fit=crop"
            "security" = "https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=1200&h=600&fit=crop"
            "theme" = "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=1200&h=600&fit=crop"
            "payment" = "https://images.unsplash.com/photo-1556745757-8d76bdb6984b?w=1200&h=600&fit=crop"
            "membership" = "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=1200&h=600&fit=crop"
            "widget" = "https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1200&h=600&fit=crop"
            "api" = "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=1200&h=600&fit=crop"
            "seo" = "https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=1200&h=600&fit=crop"
            "default" = "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?w=1200&h=600&fit=crop"
          }

          $imageUrl = $topicImages["default"]
          $topicTitle = $topic.title.ToLower()
          foreach ($key in $topicImages.Keys) {
            if ($topicTitle -match $key) {
              $imageUrl = $topicImages[$key]
              break
            }
          }

          $slug = $topic.title.ToLower() -replace '[^a-z0-9]+', '-' -replace '^-|-$', ''
          $date = Get-Date -Format "MMM dd, yyyy"
          $filename = "$slug.html"

          $cta = "`n<div style=`"background:var(--accent-glow-soft);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:24px;margin:32px 0;text-align:center`">`n  <p style=`"margin:0 0 12px;font-weight:600;color:var(--text-primary)`">Need a WordPress Developer for your project?</p>`n  <a href=`"../index.html#contact`" style=`"display:inline-block;background:var(--accent);color:#fff;padding:12px 28px;border-radius:8px;font-weight:600;text-decoration:none`">Hire Me &rarr;</a>`n</div>`n"

          $paragraphCount = 0
          $insertPos = -1
          $idx = 0
          while ($idx -lt $content.Length - 4) {
            if ($content[$idx] -eq '<' -and $content[$idx+1] -eq 'p' -and $content[$idx+2] -eq '>') {
              $paragraphCount++
              if ($paragraphCount -eq 2) {
                $closeIdx = $content.IndexOf('</p>', $idx)
                if ($closeIdx -gt 0) { $insertPos = $closeIdx + 4 }
                break
              }
            }
            $idx++
          }

          if ($insertPos -gt 0) {
            $content = $content.Substring(0, $insertPos) + $cta + $content.Substring($insertPos)
          }

          $currentYear = Get-Date -Format 'yyyy'

          $html = "<!DOCTYPE html>`n<html lang=`"en`" data-theme=`"light`">`n<head>`n<meta charset=`"UTF-8`">`n<meta name=`"viewport`" content=`"width=device-width, initial-scale=1.0`">`n<title>$($topic.title) &mdash; Shiv Parmar</title>`n<meta name=`"description`" content=`"$($topic.title) - WordPress development guide by Shiv Parmar.`">`n<link rel=`"icon`" type=`"image/svg+xml`" href=`"../favicon.svg`">`n<link rel=`"stylesheet`" href=`"../style.css`">`n<style>`n.blog-header{padding:20px 0;border-bottom:1px solid var(--border-glass)}`n.blog-header .nav{display:flex;align-items:center;justify-content:space-between}`n.blog-header .logo{font-family:var(--font-primary);font-weight:800;font-size:19px;color:var(--text-primary);text-decoration:none}.blog-header .logo span{color:var(--accent)}`n.blog-header .back{font-size:14px;font-weight:500;color:var(--text-muted)}`n.blog-header .back:hover{color:var(--accent);text-decoration:none}`n.blog-header .nav-right{display:flex;gap:12px;align-items:center}`n.blog-header .theme-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border-glass);background:var(--bg-glass);color:var(--text-primary);font-size:16px;cursor:pointer;display:grid;place-items:center}`narticle{padding:0}`n.date{font-family:var(--font-mono);font-size:13px;color:var(--text-muted);margin-bottom:12px}`nh1{font-family:var(--font-primary);font-size:clamp(28px,4vw,40px);font-weight:800;line-height:1.2;margin-bottom:24px;color:var(--text-primary)}`n.content{font-size:16px;color:var(--text-primary);font-family:var(--font-primary)}`n.content h2{font-size:22px;font-weight:700;margin:40px 0 16px;color:var(--text-primary)}`n.content h3{font-size:18px;font-weight:600;margin:32px 0 12px;color:var(--text-primary)}`n.content p{margin-bottom:16px;color:var(--text-secondary)}`n.content ul,.content ol{margin:0 0 16px 24px;color:var(--text-secondary)}`n.content li{margin-bottom:8px}`n.content code{font-family:var(--font-mono);background:var(--bg-glass-strong);padding:2px 8px;border-radius:6px;font-size:14px}`n.content pre{background:#0d0d0d;color:#c7d2fe;padding:20px;border-radius:var(--radius-lg);border:1px solid var(--border-glass);overflow-x:auto;margin:0 0 24px;font-size:14px;line-height:1.6}`n.content pre code{background:none;padding:0;color:inherit}`n.content blockquote{border-left:4px solid #c9a84c;padding:0 0 0 15px;margin:20px 0;font-style:italic;color:#fff;background:transparent;border-radius:0}`n.content blockquote em{color:#fff}`n.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:40px;padding:24px 0;border-top:1px solid var(--border-glass)}`n.tag{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--accent-glow-soft);color:var(--accent)}`n.hero-img{width:100%;height:360px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:32px;border:1px solid var(--border-glass)}`n.blog-footer{border-top:1px solid var(--border-glass);padding:32px 0;text-align:center;color:var(--text-muted);font-size:14px;font-family:var(--font-primary)}`n.blog-footer .foot-inner{display:flex;justify-content:space-between;align-items:center}`nselect option{background:#111;color:#f0f0f0;padding:8px}`n@media(max-width:640px){article{padding:0}h1{font-size:24px}.hero-img{height:200px}.blog-footer .foot-inner{flex-direction:column;gap:12px}}`n</style>`n</head>`n<body>`n  <header>`n    <div class=`"container nav`">`n      <a class=`"logo`" href=`"../index.html`">shiv<span>.</span>parmar</a>`n      <nav class=`"nav-links`" id=`"navLinks`" aria-label=`"Main navigation`">`n        <a href=`"../index.html#services`">Services</a>`n        <a href=`"../index.html#work`">Work</a>`n        <a href=`"../index.html#skills`">Skills</a>`n        <a href=`"../index.html#experience`">Experience</a>`n        <a href=`"../index.html#blog`">Blog</a>`n        <a href=`"../index.html#contact`">Contact</a>`n      </nav>`n      <div class=`"nav-right`">`n        <button class=`"theme-btn`" id=`"themeBtn`" aria-label=`"Toggle dark mode`" onclick=`"toggleTheme()`">&#9790;</button>`n        <button class=`"hamburger`" id=`"hamburger`" aria-label=`"Toggle menu`">`n          <span></span><span></span><span></span>`n        </button>`n        <a class=`"nav-cta`" href=`"../index.html#contact`">Hire Me</a>`n      </div>`n    </div>`n  </header>`n<article><div class=`"container`">`n<img src=`"$imageUrl`" alt=`"$($topic.title)`" title=`"$($topic.title)`" class=`"hero-img`">`n<div class=`"date`">$date &middot; $($topic.read) read</div>`n<h1>$($topic.title)</h1>`n<div class=`"content`">`n$content`n</div>`n<div class=`"tags`"><span class=`"tag`">WordPress</span><span class=`"tag`">Development</span></div>`n</div></article>`n<section style=`"padding:64px 0;border-top:1px solid var(--border-glass)`">`n  <div class=`"container`">`n    <div style=`"max-width:600px;margin:0 auto;text-align:center`">`n      <p class=`"eyebrow`" style=`"color:var(--accent)`">Contact</p>`n      <h2 style=`"font-size:clamp(24px,3vw,32px);font-weight:800;margin-bottom:12px`">Let's Work Together</h2>`n      <p style=`"color:var(--text-muted);margin-bottom:32px`">Have a project in mind? Send me a message and I'll get back within 24 hours.</p>`n      <form id=`"blogContactForm`" novalidate style=`"text-align:left`">`n        <div style=`"margin-bottom:16px`"><label for=`"bc-name`" style=`"display:block;font-size:14px;font-weight:600;margin-bottom:6px`">Full Name *</label><input type=`"text`" id=`"bc-name`" name=`"name`" placeholder=`"John Doe`" required style=`"width:100%;padding:12px 16px;border:1.5px solid var(--border-glass);border-radius:8px;font-size:14px;background:var(--bg-glass);color:var(--text-primary)`"></div>`n        <div style=`"margin-bottom:16px`"><label for=`"bc-email`" style=`"display:block;font-size:14px;font-weight:600;margin-bottom:6px`">Email Address *</label><input type=`"email`" id=`"bc-email`" name=`"email`" placeholder=`"john@example.com`" required style=`"width:100%;padding:12px 16px;border:1.5px solid var(--border-glass);border-radius:8px;font-size:14px;background:var(--bg-glass);color:var(--text-primary)`"></div>`n        <div style=`"margin-bottom:16px`"><label for=`"bc-subject`" style=`"display:block;font-size:14px;font-weight:600;margin-bottom:6px`">Subject *</label><select id=`"bc-subject`" name=`"subject`" required style=`"width:100%;padding:12px 16px;border:1.5px solid var(--border-glass);border-radius:8px;font-size:14px;background:var(--bg-glass);color:var(--text-primary)`"><option value=`"`" disabled selected>Select inquiry type</option><option value=`"General Inquiry`">General Inquiry</option><option value=`"Project Request`">Project Request</option><option value=`"Collaboration`">Collaboration</option><option value=`"Freelance Work`">Freelance Work</option></select></div>`n        <div style=`"margin-bottom:16px`"><label for=`"bc-message`" style=`"display:block;font-size:14px;font-weight:600;margin-bottom:6px`">Project Details *</label><textarea id=`"bc-message`" name=`"message`" rows=`"4`" placeholder=`"Tell me about your project...`" required style=`"width:100%;padding:12px 16px;border:1.5px solid var(--border-glass);border-radius:8px;font-size:14px;background:var(--bg-glass);color:var(--text-primary);resize:vertical`"></textarea></div>`n        <button type=`"submit`" style=`"width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer`">Send Message</button>`n        <p id=`"bc-formStatus`" style=`"text-align:center;margin-top:12px;font-size:14px;color:var(--text-muted)`"></p>`n      </form>`n    </div>`n  </div>`n</section>`n<footer class=`"blog-footer`"><div class=`"container foot-inner`"><span>&copy; $currentYear Shiv Parmar &middot; WordPress Developer</span><span>Full-time &middot; Contract &middot; Remote</span></div></footer>`n<script src=`"../script.js`"></script>`n<script>`nfunction toggleTheme(){const t=document.documentElement.getAttribute(`"data-theme`");document.documentElement.setAttribute(`"data-theme`,t===`"dark`"?`"light`":`"dark`")}`nconst bcForm=document.getElementById(`"blogContactForm`");if(bcForm){bcForm.addEventListener(`"submit`",async(e)=>{e.preventDefault();const btn=bcForm.querySelector(`"button[type=submit]`");const status=document.getElementById(`"bc-formStatus`");btn.textContent=`"Sending...`";btn.disabled=true;try{await fetch(`"https://script.google.com/macros/s/AKfycbyiVfJb1fVyOR4jrjHlA2mJkwmq8_6mhxe8OMMgp7GDNhNUrMr7GFTXl7lOjh8XigQF/exec`",{method:`"POST`",mode:`"no-cors`",headers:{`"Content-Type`":`"application/json`"},body:JSON.stringify({name:document.getElementById(`"bc-name`").value.trim(),email:document.getElementById(`"bc-email`").value.trim(),phone:`"`",subject:document.getElementById(`"bc-subject`").value,budget:`"`",message:document.getElementById(`"bc-message`").value.trim(),pageUrl:window.location.href})});status.textContent=`"Message sent! I'll get back within 24 hours.`";status.style.color=`"#22c55e`";bcForm.reset()}catch(err){status.textContent=`"Something went wrong. Please try again.`";status.style.color=`"#ef4444`"}btn.textContent=`"Send Message`";btn.disabled=false})}`n</script>`n</body>`n</html>"

          $filePath = Join-Path $blogDir $filename
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($filePath, $html, $utf8NoBom)
          Write-Host "Saved: $filePath"

          Write-Host "Updating homepage..."
          $indexPath = "index.html"
          $indexContent = Get-Content $indexPath -Raw -Encoding UTF8

          $newCard = "<article class=`"blog-card reveal`">`n            <div class=`"date`">$date &middot; $($topic.read) read</div>`n            <h3><a href=`"blog/$slug.html`">$($topic.title)</a></h3>`n            <p>$($topic.cat) development guide covering best practices, code examples and real-world use cases.</p>`n            <a class=`"read-more`" href=`"blog/$slug.html`">Read more &rarr;</a>`n          </article>"

          $startMarker = "<!-- BLOG_CARDS_START -->"
          $endMarker = "<!-- BLOG_CARDS_END -->"
          $startIdx = $indexContent.IndexOf($startMarker)
          $endIdx = $indexContent.IndexOf($endMarker)

          if ($startIdx -gt 0 -and $endIdx -gt $startIdx) {
            $between = $indexContent.Substring($startIdx + $startMarker.Length, $endIdx - $startIdx - $startMarker.Length)
            $existingCards = [regex]::Matches($between, '<article class="blog-card reveal">[\s\S]*?</article>')

            $newBetween = "`n" + $newCard
            $count = 0
            foreach ($card in $existingCards) {
              if ($count -lt 2) {
                $cardText = $card.Value -replace '^\s+', '          '
                $newBetween += "`n" + $cardText
                $count++
              }
            }

            $indexContent = $indexContent.Substring(0, $startIdx + $startMarker.Length) + $newBetween + "`n          " + $indexContent.Substring($endIdx)
          }

          [System.IO.File]::WriteAllText($indexPath, $indexContent, $utf8NoBom)

          Write-Host "Updating blog listing page..."
          $blogHtmlPath = "blog.html"
          $blogContent = Get-Content $blogHtmlPath -Raw -Encoding UTF8

          $listCard = "<article class=`"blog-card reveal`">`n            <div class=`"date`">$date &middot; $($topic.read) read</div>`n            <h3><a href=`"blog/$slug.html`">$($topic.title)</a></h3>`n            <p>$($topic.cat) development guide covering best practices, code examples and real-world use cases.</p>`n            <a class=`"read-more`" href=`"blog/$slug.html`">Read more &rarr;</a>`n          </article>"

          $blogStartIdx = $blogContent.IndexOf($startMarker)
          $blogEndIdx = $blogContent.IndexOf($endMarker)

          if ($blogStartIdx -gt 0 -and $blogEndIdx -gt $blogStartIdx) {
            $between = $blogContent.Substring($blogStartIdx + $startMarker.Length, $blogEndIdx - $blogStartIdx - $startMarker.Length)
            $existingCards = [regex]::Matches($between, '<article class="blog-card reveal">[\s\S]*?</article>')

            $newBetween = "`n" + $listCard
            foreach ($card in $existingCards) {
              $cardText = $card.Value -replace '^\s+', '          '
              $newBetween += "`n" + $cardText
            }

            $blogContent = $blogContent.Substring(0, $blogStartIdx + $startMarker.Length) + $newBetween + "`n          " + $blogContent.Substring($blogEndIdx)
          }

          [System.IO.File]::WriteAllText($blogHtmlPath, $blogContent, $utf8NoBom)

          Write-Host ""
          Write-Host "Blog published successfully: $($topic.title)"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "blog: auto-published $(date +'%Y-%m-%d %H:%M')"
          git push
