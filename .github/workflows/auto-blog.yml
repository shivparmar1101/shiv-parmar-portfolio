name: Auto Blog Publisher

on:
  schedule:
    - cron: '0 10,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Blog Publisher
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ONE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $apiKey = $env:GEMINI_API_KEY
          if (-not $apiKey) {
            Write-Host "ERROR: GEMINI_API_KEY secret not set!"
            exit 1
          }
          . ./blog-publisher-gemini.ps1 -ApiKey $apiKey

      - name: Send Email Notification
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const blogDir = 'blog';
            const files = fs.readdirSync(blogDir).filter(f => f.endsWith('.html'));
            
            // Get the newest file
            let newest = null;
            let newestTime = 0;
            for (const f of files) {
              const stat = fs.statSync(path.join(blogDir, f));
              if (stat.mtimeMs > newestTime) {
                newestTime = stat.mtimeMs;
                newest = f;
              }
            }
            
            if (newest) {
              const stat = fs.statSync(path.join(blogDir, newest));
              const commitTime = new Date(stat.mtimeMs);
              const now = new Date();
              const diffMinutes = (now - commitTime) / (1000 * 60);
              
              // Only notify if blog was created in last 10 minutes
              if (diffMinutes < 10) {
                const title = newest.replace('.html', '').split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                core.info(`New blog detected: ${title}`);
                core.setOutput('blog_title', title);
                core.setOutput('blog_file', `blog/${newest}`);
                core.setOutput('blog_url', `https://shiv-parmar-portfolio.netlify.app/blog/${newest.replace('.html', '')}`);
                core.setOutput('new_blog', 'true');
              } else {
                core.info('No new blog published in this run.');
                core.setOutput('new_blog', 'false');
              }
            }

      - name: Send Email via Gmail
        if: steps.github-script.outputs.new_blog == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 << 'EOF'
          import smtplib
          import os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime
          
          password = os.environ.get('GMAIL_APP_PASSWORD', '')
          if not password:
              print("No GMAIL_APP_PASSWORD set, skipping email")
              exit(0)
          
          blog_title = "${{ steps.github-script.outputs.blog_title }}"
          blog_file = "${{ steps.github-script.outputs.blog_file }}"
          blog_url = "${{ steps.github-script.outputs.blog_url }}"
          
          msg = MIMEMultipart('alternative')
          msg['Subject'] = f"New Blog Published: {blog_title}"
          msg['From'] = "parmarshiv1101@gmail.com"
          msg['To'] = "parmarshiv1101@gmail.com"
          
          html = f"""
          <html>
          <body style="font-family:Arial,sans-serif;padding:20px">
          <h2 style="color:#c9a84c">New Blog Published!</h2>
          <table style="border-collapse:collapse;width:100%;max-width:500px">
          <tr><td style="padding:8px;font-weight:bold;border-bottom:1px solid #eee">Title</td><td style="padding:8px;border-bottom:1px solid #eee">{blog_title}</td></tr>
          <tr><td style="padding:8px;font-weight:bold;border-bottom:1px solid #eee">File</td><td style="padding:8px;border-bottom:1px solid #eee">{blog_file}</td></tr>
          <tr><td style="padding:8px;font-weight:bold;border-bottom:1px solid #eee">URL</td><td style="padding:8px;border-bottom:1px solid #eee"><a href="{blog_url}">{blog_url}</a></td></tr>
          <tr><td style="padding:8px;font-weight:bold;border-bottom:1px solid #eee">Time</td><td style="padding:8px;border-bottom:1px solid #eee">{datetime.now().strftime('%b %d, %Y %H:%M:%S')}</td></tr>
          </table>
          <p style="margin-top:20px;color:#666">- Shiv Parmar Auto Blog System</p>
          </body>
          </html>
          """
          
          msg.attach(MIMEText(html, 'html'))
          
          with smtplib.SMTP_SSL('smtp.gmail.com', 465) as server:
              server.login("parmarshiv1101@gmail.com", password)
              server.sendmail("parmarshiv1101@gmail.com", "parmarshiv1101@gmail.com", msg.as_string())
          
          print("Email sent successfully!")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "blog: auto-published $(date +'%Y-%m-%d %H:%M')"
          git push
