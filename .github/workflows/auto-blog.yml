name: Auto Blog Publisher

on:
  schedule:
    - cron: '0 10,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate and Publish Blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_ONE }}
        run: node scripts/blog-publisher.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "blog: auto-published new post"
          git pull --rebase origin main
          git push
