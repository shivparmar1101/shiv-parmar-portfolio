# Google Indexing API: publish "UPDATED" urlNotifications for the newest sitemap URLs.
# Companion to gsc-indexing.yml (sitemap submit + URL Inspection).
# Runs daily after the new post is published; best-effort, exits 0 even when the API
# rejects the request (Google documents this API for JobPosting/LiveStream only).
name: Request Indexing

on:
  schedule:
    - cron: '45 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish urlNotifications (newest 10 URLs)
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
        run: node scripts/request-indexing.js --last=10

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexing-api-${{ github.run_number }}
          path: seo-data/indexing-api-status.json
          retention-days: 30
          if-no-files-found: ignore
