<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#060918"/>

  <!-- World map outline (simplified) -->
  <g opacity="0.03" fill="none" stroke="#c9a84c" stroke-width="1.5">
    <ellipse cx="300" cy="280" rx="180" ry="120"/>
    <ellipse cx="650" cy="250" rx="150" ry="140"/>
    <ellipse cx="950" cy="300" rx="130" ry="100"/>
    <ellipse cx="150" cy="350" rx="80" ry="60"/>
    <ellipse cx="500" cy="400" rx="100" ry="70"/>
  </g>

  <!-- Shipping zones as concentric regions -->
  <g opacity="0.07">
    <circle cx="600" cy="280" r="200" fill="none" stroke="#c9a84c" stroke-width="1" stroke-dasharray="8,4"/>
    <circle cx="600" cy="280" r="160" fill="none" stroke="#c9a84c" stroke-width="1.5" stroke-dasharray="6,3"/>
    <circle cx="600" cy="280" r="120" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <circle cx="600" cy="280" r="80" fill="#c9a84c" opacity="0.03" stroke="#c9a84c" stroke-width="2"/>
  </g>

  <!-- Location pin markers -->
  <g filter="url(#glow)">
    <!-- Zone markers -->
    <g transform="translate(400, 200)" opacity="0.2">
      <path d="M0,-20 C-11,-20 -20,-11 -20,0 C0,25 0,25 0,25 C0,25 0,25 20,0 C20,-11 11,-20 0,-20Z" fill="#c9a84c"/>
      <circle cx="0" cy="-2" r="6" fill="#060918"/>
    </g>
    <g transform="translate(750, 180)" opacity="0.17">
      <path d="M0,-16 C-9,-16 -16,-9 -16,0 C0,20 0,20 0,20 C0,20 0,20 16,0 C16,-9 9,-16 0,-16Z" fill="#c9a84c"/>
      <circle cx="0" cy="-2" r="5" fill="#060918"/>
    </g>
    <g transform="translate(550, 380)" opacity="0.15">
      <path d="M0,-18 C-10,-18 -18,-10 -18,0 C0,22 0,22 0,22 C0,22 0,22 18,0 C18,-10 10,-18 0,-18Z" fill="#c9a84c"/>
      <circle cx="0" cy="-2" r="5.5" fill="#060918"/>
    </g>
    <g transform="translate(850, 320)" opacity="0.13">
      <path d="M0,-14 C-8,-14 -14,-8 -14,0 C0,18 0,18 0,18 C0,18 0,18 14,0 C14,-8 8,-14 0,-14Z" fill="#c9a84c"/>
      <circle cx="0" cy="-2" r="4.5" fill="#060918"/>
    </g>
  </g>

  <!-- Shipping routes (dotted lines connecting pins) -->
  <g stroke="#c9a84c" stroke-width="1.5" fill="none" opacity="0.08" stroke-dasharray="6,4">
    <path d="M400,200 Q575,150 750,180"/>
    <path d="M400,200 Q475,290 550,380"/>
    <path d="M750,180 Q800,250 850,320"/>
    <path d="M550,380 Q700,350 850,320"/>
  </g>

  <!-- Package/box icons -->
  <g opacity="0.07" fill="none" stroke="#c9a84c" stroke-width="1.5">
    <rect x="200" y="140" width="40" height="35" rx="3"/>
    <line x1="220" y1="140" x2="220" y2="175"/>
    <line x1="200" y1="155" x2="240" y2="155"/>
    
    <rect x="900" y="400" width="35" height="30" rx="3"/>
    <line x1="917" y1="400" x2="917" y2="430"/>
    <line x1="900" y1="412" x2="935" y2="412"/>
    
    <rect x="350" y="420" width="30" height="25" rx="2"/>
    <line x1="365" y1="420" x2="365" y2="445"/>
    <line x1="350" y1="430" x2="380" y2="430"/>
  </g>

  <!-- Truck icon (shipping) -->
  <g transform="translate(100, 350)" opacity="0.07" fill="none" stroke="#c9a84c" stroke-width="1.5">
    <rect x="0" y="5" width="60" height="30" rx="3"/>
    <rect x="60" y="12" width="25" height="23" rx="3"/>
    <circle cx="15" cy="40" r="6"/>
    <circle cx="70" cy="40" r="6"/>
    <line x1="60" y1="12" x2="60" y2="35"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#c9a84c" stroke-width="1" opacity="0.05">
    <line x1="50" y1="370" x2="90" y2="370"/>
    <line x1="40" y1="380" x2="85" y2="380"/>
    <line x1="55" y1="390" x2="95" y2="390"/>
  </g>

  <!-- Globe grid lines -->
  <g opacity="0.02" fill="none" stroke="#c9a84c" stroke-width="0.8">
    <ellipse cx="600" cy="280" rx="250" ry="180"/>
    <ellipse cx="600" cy="280" rx="250" ry="90"/>
    <ellipse cx="600" cy="280" rx="125" ry="180"/>
    <line x1="350" y1="280" x2="850" y2="280"/>
    <line x1="600" y1="100" x2="600" y2="460"/>
  </g>

  <!-- Zone labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#c9a84c" opacity="0.1">
    <text x="400" y="170">Zone 1</text>
    <text x="740" y="155">Zone 2</text>
    <text x="540" y="410">Zone 3</text>
    <text x="840" y="300">Zone 4</text>
  </g>

  <!-- Decorative corner elements -->
  <g opacity="0.07" fill="none" stroke="#c9a84c" stroke-width="1.5">
    <path d="M30,30 L30,70 M30,30 L70,30"/>
    <path d="M1170,30 L1170,70 M1170,30 L1130,30"/>
    <path d="M30,600 L30,560 M30,600 L70,600"/>
    <path d="M1170,600 L1170,560 M1170,600 L1130,600"/>
  </g>

  <!-- Title -->
  <text x="600" y="530" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#ffffff" text-anchor="middle" font-weight="bold">WooCommerce Shipping Zones</text>
  
  <!-- Subtle underline -->
  <rect x="380" y="555" width="440" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>