<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#060918"/>
  
  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#c9a84c" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#c9a84c" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#c9a84c" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#c9a84c" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#c9a84c" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#c9a84c" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#c9a84c" stroke-width="1"/>
  </g>

  <!-- Mega menu concept: dropdown panels -->
  <g opacity="0.05">
    <rect x="80" y="60" width="300" height="80" rx="8" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <rect x="80" y="140" width="300" height="60" rx="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <rect x="80" y="200" width="300" height="60" rx="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <rect x="80" y="260" width="300" height="60" rx="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
    <rect x="80" y="320" width="300" height="60" rx="8" fill="none" stroke="#c9a84c" stroke-width="1.5"/>
  </g>

  <!-- Navigation bar shape -->
  <rect x="60" y="45" width="1100" height="55" rx="6" fill="url(#goldGrad2)" opacity="0.1"/>
  
  <!-- Menu items -->
  <g opacity="0.17">
    <rect x="100" y="55" width="80" height="35" rx="4" fill="#c9a84c" opacity="0.1"/>
    <rect x="200" y="55" width="80" height="35" rx="4" fill="#c9a84c" opacity="0.1"/>
    <rect x="300" y="55" width="120" height="35" rx="4" fill="#c9a84c" opacity="0.17"/>
    <rect x="440" y="55" width="80" height="35" rx="4" fill="#c9a84c" opacity="0.1"/>
    <rect x="540" y="55" width="100" height="35" rx="4" fill="#c9a84c" opacity="0.1"/>
  </g>

  <!-- Abstract mega menu dropdown -->
  <g opacity="0.08" transform="translate(250, 110)">
    <rect x="0" y="0" width="700" height="350" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="20" y="20" width="200" height="310" rx="8" fill="#c9a84c" opacity="0.03" stroke="#c9a84c" stroke-width="1"/>
    <rect x="240" y="20" width="220" height="150" rx="8" fill="#c9a84c" opacity="0.03" stroke="#c9a84c" stroke-width="1"/>
    <rect x="240" y="180" width="220" height="150" rx="8" fill="#c9a84c" opacity="0.03" stroke="#c9a84c" stroke-width="1"/>
    <rect x="480" y="20" width="200" height="310" rx="8" fill="#c9a84c" opacity="0.03" stroke="#c9a84c" stroke-width="1"/>
  </g>

  <!-- Floating icons representing menu categories -->
  <g filter="url(#glow)">
    <circle cx="1050" cy="120" r="25" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.13"/>
    <circle cx="1100" cy="200" r="18" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.1"/>
    <circle cx="1020" cy="280" r="22" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.12"/>
    <circle cx="1120" cy="380" r="20" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.08"/>
  </g>

  <!-- Connecting lines -->
  <g opacity="0.05" stroke="#c9a84c" stroke-width="1">
    <line x1="300" y1="90" x2="350" y2="130"/>
    <line x1="350" y1="130" x2="400" y2="180"/>
    <line x1="400" y1="180" x2="500" y2="250"/>
    <line x1="500" y1="250" x2="600" y2="300"/>
    <line x1="600" y1="300" x2="700" y2="350"/>
  </g>

  <!-- Decorative dots -->
  <g fill="#c9a84c" opacity="0.13">
    <circle cx="150" cy="480" r="3"/>
    <circle cx="180" cy="500" r="2"/>
    <circle cx="210" cy="490" r="4"/>
    <circle cx="240" cy="510" r="2"/>
    <circle cx="950" cy="450" r="3"/>
    <circle cx="980" cy="470" r="2"/>
    <circle cx="1010" cy="460" r="4"/>
    <circle cx="1040" cy="480" r="2"/>
  </g>

  <!-- WordPress logo hint (circular with W) -->
  <g transform="translate(1080, 480)" opacity="0.07">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="28" fill="#c9a84c" text-anchor="middle" font-weight="bold">W</text>
  </g>

  <!-- Arrow indicators for dropdown -->
  <g opacity="0.1" fill="#c9a84c">
    <polygon points="175,68 185,68 180,78"/>
    <polygon points="375,68 385,68 380,78"/>
  </g>

  <!-- Title -->
  <text x="600" y="530" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#ffffff" text-anchor="middle" font-weight="bold">WordPress Mega Menu</text>
  
  <!-- Subtle underline -->
  <rect x="400" y="555" width="400" height="3" rx="1.5" fill="url(#goldGrad)" opacity="0.6"/>
</svg>