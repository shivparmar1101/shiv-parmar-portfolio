<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Shiv Parmar | WordPress Developer</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(80px, 15vw, 160px);
      font-weight: 800;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 40px rgba(201, 168, 76, 0.3));
    }
    .error-title {
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
    }
    .error-msg {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto 40px;
      line-height: 1.75;
    }
    .error-actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-msg">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="index.html">Go Home <span class="arrow">&rarr;</span></a>
        <a class="btn btn-ghost" href="index.html#contact">Contact Me</a>
      </div>
    </div>
  </div>
</body>
</html>
